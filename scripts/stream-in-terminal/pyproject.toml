[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-in-terminal"
version = "0.1.0"
description = "Watch live Twitch streams as terminal pixel art"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "stream-in-unexpected-places contributors" }]
keywords = ["twitch", "terminal", "livestream", "pixel-art"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]

[project.scripts]
stream-in-terminal = "stream_in_terminal.__main__:main"
sit = "stream_in_terminal.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
